"""
GraphQL API сервиса client-info.

Схема заменяет набор REST-ресурсов:
- GET /clients/{id}
- GET /clients/{id}/documents
- GET /clients/{id}/relatives

Потребитель может запросить только нужные поля клиента, документов и родственников,
не выполняя несколько REST-вызовов и не получая лишние данные карточки клиента.
"""

schema {
  query: Query
}

"""
Дата в формате ISO 8601: YYYY-MM-DD.
"""
scalar Date

"""
Корневые запросы client-info.
"""
type Query {
  """
  Получить карточку клиента по идентификатору.

  Через вложенные поля можно сразу запросить документы и родственников клиента,
  если они нужны конкретному пользовательскому сценарию.
  """
  client(id: ID!): Client

  """
  Получить список документов клиента.
  Запрос покрывает REST-операцию GET /clients/{id}/documents.
  """
  clientDocuments(clientId: ID!): [Document!]!

  """
  Получить список родственников клиента.
  Запрос покрывает REST-операцию GET /clients/{id}/relatives.
  """
  clientRelatives(clientId: ID!): [Relative!]!
}

"""
Клиент InsureTech.
"""
type Client {
  """
  Уникальный идентификатор клиента.
  """
  id: ID!

  """
  Имя клиента из текущего REST-контракта.
  """
  name: String!

  """
  Возраст клиента.
  """
  age: Int

  """
  Документы клиента.

  Поле загружается только если потребитель явно включил его в GraphQL-запрос.
  """
  documents: [Document!]!

  """
  Родственники клиента.

  Поле загружается только если потребитель явно включил его в GraphQL-запрос.
  """
  relatives: [Relative!]!
}

"""
Документ клиента.
"""
type Document {
  """
  Уникальный идентификатор документа.
  """
  id: ID!

  """
  Тип документа: паспорт, загранпаспорт, водительское удостоверение и другие.
  """
  type: String!

  """
  Номер документа.
  """
  number: String!

  """
  Дата выдачи документа.
  """
  issueDate: Date

  """
  Дата окончания срока действия документа.
  """
  expiryDate: Date
}

"""
Родственник клиента.
"""
type Relative {
  """
  Уникальный идентификатор записи о родственнике.
  """
  id: ID!

  """
  Тип родственной связи.
  """
  relationType: String!

  """
  Имя родственника.
  """
  name: String!

  """
  Возраст родственника.
  """
  age: Int
}
