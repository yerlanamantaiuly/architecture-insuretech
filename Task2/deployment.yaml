apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-demo-app
  labels:
    app: insuretech-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-demo-app
  template:
    metadata:
      labels:
        app: insuretech-demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import http.server
              import socketserver
              import threading

              requests_total = 0
              memory_chunks = []
              lock = threading.Lock()

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      global requests_total
                      with lock:
                          if self.path == "/":
                              requests_total += 1
                              if len(memory_chunks) < 320:
                                  memory_chunks.append(bytearray(256 * 1024))

                      if self.path == "/metrics":
                          with lock:
                              body = (
                                  "# HELP http_requests_total Количество HTTP-запросов к демо-приложению\n"
                                  "# TYPE http_requests_total counter\n"
                                  f"http_requests_total {requests_total}\n"
                              )
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; version=0.0.4")
                          self.end_headers()
                          self.wfile.write(body.encode())
                          return

                      if self.path == "/":
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; charset=utf-8")
                          self.end_headers()
                          self.wfile.write("Демо-приложение InsureTech\n".encode())
                          return

                      self.send_response(404)
                      self.end_headers()

                  def log_message(self, format, *args):
                      return

              with socketserver.ThreadingTCPServer(("", 8080), Handler) as server:
                  server.daemon_threads = True
                  server.serve_forever()
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 30Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
