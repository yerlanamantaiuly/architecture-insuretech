apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-demo-app
  labels:
    app: insuretech-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-demo-app
  template:
    metadata:
      labels:
        app: insuretech-demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: cr.yandex/crpouj6ur8i0r2n7e1lb/architecture-insuretech-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 20Mi
            limits:
              cpu: 500m
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
