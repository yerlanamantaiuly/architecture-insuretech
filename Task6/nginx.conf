http {
    # Зона хранения счётчиков запросов по IP-адресу клиента.
    # Лимит: не более 10 запросов в минуту для одного клиента.
    limit_req_zone $binary_remote_addr zone=partner_api_limit:10m rate=10r/m;

    # При превышении лимита Nginx вернёт HTTP 429 Too Many Requests.
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки.
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # burst не задан, поэтому запросы сверх 10 в минуту отклоняются сразу.
            limit_req zone=partner_api_limit;

            proxy_pass http://backend_servers;
        }
    }
}
